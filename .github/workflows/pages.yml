name: Publicar guía en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/guia/**", "app/finanzas/static/logo.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir la web a partir de app/guia/guia.html
        run: |
          mkdir -p _site
          {
            printf '%s' '<!doctype html><html lang="es" data-theme="dark"><head><meta charset="utf-8">'
            printf '%s' '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            printf '%s' '<link rel="icon" href="logo.svg"></head><body>'
            cat app/guia/guia.html
            printf '%s' '</body></html>'
          } > _site/index.html
          cp app/finanzas/static/logo.svg _site/logo.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
