    <polyline points="8,46 22,36 34,40 56,14" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="42" font-family="DejaVu Sans" font-weight="bold" font-size="38" fill="#e6edf6">Finanzas<tspan fill="#f5b700">OS</tspan></text>
